name: Publication

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publication-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Verify release tag
        run: >-
          node -e "const expected = 'v' + JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version;
          const tags = require('node:child_process').execFileSync('git', ['tag', '--points-at', 'HEAD'], {encoding: 'utf8'}).split(/\r?\n/).filter(Boolean);
          if (tags.length !== 1 || tags[0] !== expected || !/^v\d+\.\d+\.\d+$/.test(tags[0])) throw new Error('Release tag must be the exact package version: ' + expected)"
      - name: Verify package version
        shell: bash
        run: test "$(npm pkg get version --raw)" = "${GITHUB_REF_NAME#v}"
      - name: Publish to npm
        run: npm publish --access public --provenance
